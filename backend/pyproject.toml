version = "0.1.0"
description = "Multimodal Graph RAG v2 with Hybrid Worker-Server Architecture"
authors = ["Admin <admin@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
celery = "^5.3.6"
redis = "^5.0.1"
neo4j = "^5.16.0"
weaviate-client = "^4.4.0"
sqlmodel = "^0.0.14"
psycopg2-binary = "^2.9.9"
