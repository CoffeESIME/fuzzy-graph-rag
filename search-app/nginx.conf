server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy /api/* → backend (strip the /api prefix)
    # El backend sigue usando sus rutas originales: /search, /chat, /analysis, etc.
    # El frontend siempre usa /api/... → Nginx quita /api/ y reenvía el resto
    location = /api/analysis/explain-path {
        proxy_pass http://backend:8000/analysis/explain-path;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 960s;
        proxy_send_timeout 960s;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts para operaciones largas (ingesta, análisis, pathfinder)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # SPA: redirige cualquier ruta no-API a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

